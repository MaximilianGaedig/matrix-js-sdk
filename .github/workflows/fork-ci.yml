name: Fork CI
on:
    pull_request: {}
    push:
        branches: [offline-startup]
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
permissions: {} # No permissions needed
jobs:
    types:
        name: "Typecheck"
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: 🔨 Setup pnpm & node
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  runtime: node
                  cache: true
                  install: true

            - run: pnpm lint:types

    lint:
        name: "Oxc lint and format"
        runs-on: ubuntu-26.04
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: 🔨 Setup pnpm & node
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  runtime: node
                  cache: true
                  install: true

            - run: pnpm lint:js

    test:
        name: "Vitest"
        runs-on: ubuntu-26.04
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  persist-credentials: false

            - name: 🔨 Setup pnpm & node
              uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
              with:
                  runtime: node
                  cache: true
                  install: true

            - run: pnpm test
